<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Video Optimizer</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7f5;color:#17201b}.wrap{max-width:820px;margin:auto;padding:25px 15px}.card{background:white;padding:20px;border-radius:18px}.drop{border:2px dashed #ccd7d0;border-radius:15px;padding:70px 20px;text-align:center}.btn{border:0;border-radius:12px;padding:13px 20px;background:#20b45a;color:white;font-weight:bold;cursor:pointer}.hidden{display:none}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.preview{margin-top:15px;background:#111;border-radius:12px;overflow:hidden}.preview video{max-width:100%;max-height:430px;display:block;margin:auto}.notice{background:#eff9f2;padding:12px;border-radius:12px;margin-top:14px}.bar{height:10px;background:#e8ede9;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#20b45a}.status{font-size:13px;color:#647068;margin-top:8px}
</style></head><body><div class="wrap"><h1>WhatsApp Video Optimizer</h1>
<div class="card"><div id="drop" class="drop"><h2>Videonu seç</h2><p>iPhone MOV / MP4 ve diğer video dosyaları</p>
<label class="btn">Video Seç<input id="file" type="file" accept="video/*,.mov,.m4v,.mp4,.hevc,.mkv,.webm,.avi,.3gp" hidden></label>
<p>Video sunucuya yüklenmez; cihazında işlenir.</p></div>
<div id="work" class="hidden"><div class="row"><span>Dosya</span><b id="fname"></b></div><div class="row"><span>Boyut</span><b id="fsize"></b></div><div class="row"><span>Kaynak</span><b id="fmeta"></b></div><div class="row"><span>Profil</span><b id="profile"></b></div>
<div class="preview"><video id="video" controls playsinline></video></div>
<div class="notice">Hızlı profil: 1080p kaynak büyütülmez. 1080p'den büyük videolar 1920 uzun kenara indirilir. Renk/ışık filtresi uygulanmaz.</div>
<button id="go" class="btn" style="width:100%;margin-top:15px">WhatsApp için optimize et</button>
<div id="progress" class="hidden" style="margin-top:15px"><div class="bar"><i id="bar"></i></div><div id="status" class="status">Hazırlanıyor…</div></div><div id="done" class="notice hidden"></div></div></div></div>
<script type="module">
import {FFmpeg} from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm";
import {fetchFile,toBlobURL} from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm";
const $=x=>document.getElementById(x),file=$("file"),drop=$("drop"),work=$("work"),video=$("video"),go=$("go");
let selected=null,ffmpeg=null,loaded=false;
const fmt=n=>n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(2)+" MB";
file.onchange=e=>pick(e.target.files[0]);
function pick(f){if(!f)return;selected=f;$("fname").textContent=f.name;$("fsize").textContent=fmt(f.size);video.src=URL.createObjectURL(f);work.classList.remove("hidden");video.onloadedmetadata=()=>{let w=video.videoWidth,h=video.videoHeight;$("fmeta").textContent=w+" × "+h+" • "+Math.round(video.duration)+" sn";$("profile").textContent=Math.max(w,h)>1920?"1080p hızlı kalite":"Kaynak çözünürlük korunuyor"}}
["dragenter","dragover"].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault()}));drop.addEventListener("drop",e=>{e.preventDefault();pick(e.dataTransfer.files[0])});
async function loadFFmpeg(){if(loaded)return;ffmpeg=new FFmpeg();ffmpeg.on("progress",({progress})=>$("bar").style.width=Math.min(99,Math.max(1,progress*100))+"%");$("status").textContent="Video motoru hazırlanıyor…";const base="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm";await ffmpeg.load({classWorkerURL:new URL("./ffmpeg/worker.js",location.href).href,coreURL:await toBlobURL(base+"/ffmpeg-core.js","text/javascript"),wasmURL:await toBlobURL(base+"/ffmpeg-core.wasm","application/wasm")});loaded=true}
go.onclick=async()=>{if(!selected)return;go.disabled=true;$("progress").classList.remove("hidden");try{await loadFFmpeg();const ext=(selected.name.split(".").pop()||"mp4").toLowerCase(),input="source."+ext;await ffmpeg.writeFile(input,await fetchFile(selected));let w=video.videoWidth,h=video.videoHeight,args=["-i",input];if(Math.max(w,h)>1920)args.push("-vf","scale=w=1920:h=1920:force_original_aspect_ratio=decrease:force_divisible_by=2:flags=lanczos,format=yuv420p");else args.push("-vf","format=yuv420p");args.push("-c:v","libx264","-preset","veryfast","-crf","19","-profile:v","high","-pix_fmt","yuv420p","-c:a","aac","-b:a","128k","-ar","48000","-movflags","+faststart","whatsapp.mp4");$("status").textContent="Hızlı kalite profiliyle dönüştürülüyor…";await ffmpeg.exec(args);let data=await ffmpeg.readFile("whatsapp.mp4"),blob=new Blob([data.buffer],{type:"video/mp4"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=selected.name.replace(/\.[^.]+$/,"")+"_whatsapp.mp4";a.click();$("bar").style.width="100%";$("status").textContent="Tamamlandı.";$("done").textContent="Hazır: "+fmt(selected.size)+" → "+fmt(blob.size);$("done").classList.remove("hidden");try{await ffmpeg.deleteFile(input);await ffmpeg.deleteFile("whatsapp.mp4")}catch(_){}}catch(e){console.error(e);alert("Video işlenemedi:\n\n"+(e.message||e));$("status").textContent="İşlem başarısız."}finally{go.disabled=false}};
</script></body></html>
